name: Android APK Build
on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        distribution: 'zulu'
        java-version: '17'

    - name: Unzip and Fix Paths
      run: |
        unzip -o care-taker.zip -d extracted_project
        SETTINGS_PATH=$(find extracted_project -name "settings.gradle*" | head -n 1)
        PROJECT_DIR=$(dirname "$SETTINGS_PATH")
        
        mv "$PROJECT_DIR"/* . 2>/dev/null || true
        mv "$PROJECT_DIR"/[._]* . 2>/dev/null || true

    - name: Handle Missing Environment and API Keys
      run: |
        if [ ! -f .env.example ]; then touch .env.example; fi
        if [ ! -f .env ]; then touch .env; fi
        
        # local.properties ka masla hal karna
        echo "sdk.dir=$ANDROID_HOME" > local.properties
        
        # AGAR code me GEMINI_API_KEY missing hai, toh BuildConfig ya gradle properties me dummy insert karna
        echo "GEMINI_API_KEY=\"dummy_key_value\"" >> local.properties
        echo "GEMINI_API_KEY=dummy_key_value" >> gradle.properties

    - name: Generate and Copy Debug Keystore Everywhere
      run: |
        if [ ! -f debug.keystore ]; then
          keytool -genkey -v -keystore debug.keystore -storepass android -alias androiddebugkey -keypass android -keyalg RSA -keysize 2048 -validity 10000 -dname "CN=Android Debug,O=Android,C=US"
        fi
        mkdir -p app/certs
        cp debug.keystore app/ 2>/dev/null || true
        cp debug.keystore app/certs/ 2>/dev/null || true

    - name: Force Build APK Without Errors
      run: |
        if [ ! -f gradlew ]; then
          gradle wrapper
        fi
        chmod +x gradlew
        ./gradlew clean
        
        # Strict checking bypass karke seedha APK generate karna
        ./gradlew assembleDebug -x lint -x test -PBUILD_CONF_GEMINI_API_KEY="dummy" --stacktrace --console=plain

    - name: Upload APK
      uses: actions/upload-artifact@v4
      with:
        name: app-debug-apk
        path: "**/build/outputs/apk/debug/*.apk"
        
