name: Android APK Build
on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        distribution: 'zulu'
        java-version: '17'

    - name: Smart Unzip and Locate Project
      run: |
        unzip -o care-taker.zip -d extracted_project
        # Yeh command khud gradlew file ko dhoond nikalegi
        GRADLEW_PATH=$(find extracted_project -name gradlew)
        echo "Found gradlew at: $GRADLEW_PATH"
        PROJECT_DIR=$(dirname "$GRADLEW_PATH")
        # Saari files ko baahir main screen par shift karna
        mv "$PROJECT_DIR"/* . 2>/dev/null || true
        mv "$PROJECT_DIR"/.* . 2>/dev/null || true

    - name: Grant permissions
      run: chmod +x gradlew

    - name: Build Debug APK
      run: ./gradlew assembleDebug

    - name: Upload APK
      uses: actions/upload-artifact@v4
      with:
        name: app-debug-apk
        path: "**/build/outputs/apk/debug/*.apk"
        
