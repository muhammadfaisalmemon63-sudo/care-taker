name: Android APK Build
on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        distribution: 'zulu'
        java-version: '17'

    - name: Unzip and Fix Paths
      run: |
        unzip -o care-taker.zip -d extracted_project
        # Asal project folder dhoondna jahan settings file hai
        SETTINGS_PATH=$(find extracted_project -name "settings.gradle*" | head -n 1)
        PROJECT_DIR=$(dirname "$SETTINGS_PATH")
        echo "Project directory found at: $PROJECT_DIR"
        
        # Saari files ko main screen (root) par shift karna
        mv "$PROJECT_DIR"/* . 2>/dev/null || true
        mv "$PROJECT_DIR"/[._]* . 2>/dev/null || true

    - name: Handle Missing Environment Files
      run: |
        # Agar .env.example missing hai toh khud se dummy file create karo taake build crash na ho
        if [ ! -f .env.example ]; then
          echo "Creating missing .env.example file..."
          touch .env.example
        fi
        if [ ! -f .env ]; then
          touch .env
        fi

    - name: Setup Gradle and Build APK
      run: |
        if [ -f gradlew ]; then
          chmod +x gradlew
          ./gradlew assembleDebug
        else
          echo "Generating missing gradle wrapper..."
          gradle wrapper
          chmod +x gradlew
          ./gradlew assembleDebug
        fi

    - name: Upload APK
      uses: actions/upload-artifact@v4
      with:
        name: app-debug-apk
        path: "**/build/outputs/apk/debug/*.apk"
        
