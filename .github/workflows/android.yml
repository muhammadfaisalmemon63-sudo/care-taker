name: Android APK Build
on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        distribution: 'zulu'
        java-version: '17'

    - name: Unzip and Fix Paths
      run: |
        unzip -o care-taker.zip -d extracted_project
        SETTINGS_PATH=$(find extracted_project -name "settings.gradle*" | head -n 1)
        PROJECT_DIR=$(dirname "$SETTINGS_PATH")
        echo "Project directory found at: $PROJECT_DIR"
        
        mv "$PROJECT_DIR"/* . 2>/dev/null || true
        mv "$PROJECT_DIR"/[._]* . 2>/dev/null || true

    - name: Handle Missing Environment Files
      run: |
        if [ ! -f .env.example ]; then
          touch .env.example
        fi
        if [ ! -f .env ]; then
          touch .env
        fi

    - name: Generate and Copy Debug Keystore Everywhere
      run: |
        if [ ! -f debug.keystore ]; then
          keytool -genkey -v -keystore debug.keystore -storepass android -alias androiddebugkey -keypass android -keyalg RSA -keysize 2048 -validity 10000 -dname "CN=Android Debug,O=Android,C=US"
        fi
        mkdir -p app/certs
        cp debug.keystore app/ 2>/dev/null || true
        cp debug.keystore app/certs/ 2>/dev/null || true

    - name: Setup Gradle and Build APK with Auto Diagnostic
      run: |
        if [ ! -f gradlew ]; then
          echo "Generating missing gradle wrapper..."
          gradle wrapper
        fi
        chmod +x gradlew
        ./gradlew clean
        
        # Build chalayein, agar fail ho toh aakhri 100 lines khud print karein
        ./gradlew assembleDebug --stacktrace --console=plain --no-daemon || {
          echo "========================================="
          echo "BUILD FAILED! PRINTING RECENT ERROR LOGS:"
          echo "========================================="
          ./gradlew assembleDebug --console=plain --no-daemon -q 2>&1 | tail -n 100
          exit 1
        }

    - name: Upload APK
      uses: actions/upload-artifact@v4
      with:
        name: app-debug-apk
        path: "**/build/outputs/apk/debug/*.apk"
        
