name: Android APK Build
on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        distribution: 'zulu'
        java-version: '17'

    - name: Unzip care-taker.zip
      run: |
        sudo apt-get install unzip
        unzip -o care-taker.zip -d extracted_project
        # Files ko root directory me le kar aana
        cd extracted_project/* 2>/dev/null || cd extracted_project
        mv * ../../ 2>/dev/null || true
        cd ../..

    - name: Grant permissions
      run: chmod +x gradlew

    - name: Build Debug APK
      run: ./gradlew assembleDebug

    - name: Upload APK
      uses: actions/upload-artifact@v4
      with:
        name: app-debug-apk
        path: "**/build/outputs/apk/debug/*.apk"
        
