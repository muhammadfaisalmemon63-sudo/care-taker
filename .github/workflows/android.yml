name: Android APK Build
on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        distribution: 'zulu'
        java-version: '17'

    - name: Unzip and Setup Project
      run: |
        unzip -o care-taker.zip -d extracted_project
        # Agar koi folder andar hai toh uski files baahir le aao
        GRADLEW_PATH=$(find extracted_project -name gradlew)
        if [ ! -z "$GRADLEW_PATH" ]; then
          PROJECT_DIR=$(dirname "$GRADLEW_PATH")
          mv "$PROJECT_DIR"/* . 2>/dev/null || true
          mv "$PROJECT_DIR"/.* . 2>/dev/null || true
        else
          # Agar gradlew bilkul nahi mila, toh extracted files ko root par move karo
          cd extracted_project/* 2>/dev/null || cd extracted_project
          mv * ../../ 2>/dev/null || true
          cd ../..
        fi

    - name: Force Gradle Wrapper Setup
      run: |
        # Agar gradlew abhi bhi missing hai, toh khud naya create karo taake error na aaye
        if [ ! -f gradlew ]; then
          echo "Gradlew not found in zip, generating a new one..."
          gradle wrapper
        fi
        chmod +x gradlew

    - name: Build Debug APK
      run: ./gradlew assembleDebug

    - name: Upload APK
      uses: actions/upload-artifact@v4
      with:
        name: app-debug-apk
        path: "**/build/outputs/apk/debug/*.apk"
        
