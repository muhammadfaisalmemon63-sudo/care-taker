name: Android APK Build
on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        distribution: 'zulu'
        java-version: '17'

    - name: Unzip and Fix Paths
      run: |
        unzip -o care-taker.zip -d extracted_project
        SETTINGS_PATH=$(find extracted_project -name "settings.gradle*" | head -n 1)
        PROJECT_DIR=$(dirname "$SETTINGS_PATH")
        
        mv "$PROJECT_DIR"/* . 2>/dev/null || true
        mv "$PROJECT_DIR"/[._]* . 2>/dev/null || true

    - name: Ultimate Code Patching
      run: |
        if [ ! -f .env.example ]; then touch .env.example; fi
        if [ ! -f .env ]; then touch .env; fi
        echo "sdk.dir=$ANDROID_HOME" > local.properties
        
        # Sabhi files me dynamic key insertion
        echo "GEMINI_API_KEY=\"dummy_key_value\"" >> local.properties
        echo "GEMINI_API_KEY=dummy_key_value" >> gradle.properties
        
        # Har java aur kt file ke andar references ko compile-ready banana
        find . -type f \( -name "*.kt" -o -name "*.java" -o -name "*.gradle*" \) -exec sed -i 's/BuildConfig.GEMINI_API_KEY/"dummy_key"/g' {} + 2>/dev/null || true
        find . -type f \( -name "*.kt" -o -name "*.java" -o -name "*.gradle*" \) -exec sed -i 's/GEMINI_API_KEY/"dummy_key"/g' {} + 2>/dev/null || true

    - name: Generate and Copy Debug Keystore Everywhere
      run: |
        if [ ! -f debug.keystore ]; then
          keytool -genkey -v -keystore debug.keystore -storepass android -alias androiddebugkey -keypass android -keyalg RSA -keysize 2048 -validity 10000 -dname "CN=Android Debug,O=Android,C=US"
        fi
        mkdir -p app/certs
        cp debug.keystore app/ 2>/dev/null || true
        cp debug.keystore app/certs/ 2>/dev/null || true

    - name: Guaranteed APK Build & Log Extraction
      run: |
        if [ ! -f gradlew ]; then
          gradle wrapper
        fi
        chmod +x gradlew
        ./gradlew clean
        
        # Build execute karke output file me store karna taake detailed debugging ho sake
        ./gradlew assembleDebug -x lint -x test --stacktrace --console=plain > gradle_build.log 2>&1 || {
          echo "=================================================="
          echo "❌ CRITICAL ERROR LOGS:"
          echo "=================================================="
          tail -n 150 gradle_build.log
          exit 1
        }

    - name: Upload APK
      uses: actions/upload-artifact@v4
      with:
        name: app-debug-apk
        path: "**/build/outputs/apk/debug/*.apk"
        
