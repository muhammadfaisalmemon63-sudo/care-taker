name: Android APK Build
on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        distribution: 'zulu'
        java-version: '17'

    - name: Clean Extract and Auto-Find Project
      run: |
        rm -rf extracted_project
        unzip -o care-taker.zip -d extracted_project
        SETTINGS_PATH=$(find extracted_project -name "settings.gradle*" | head -n 1)
        
        if [ -z "$SETTINGS_PATH" ]; then
          echo "Settings.gradle nahi mili! Root par hi build check karte hain."
        else
          PROJECT_DIR=$(dirname "$SETTINGS_PATH")
          echo "Project yahan mila: $PROJECT_DIR"
          cp -r "$PROJECT_DIR"/* . 2>/dev/null || true
          cp -r "$PROJECT_DIR"/.[!.]* . 2>/dev/null || true
        fi

    - name: Create Safe Environment Files
      env:
        SECURE_GEMINI_KEY: ${{ secrets.GEMINI_API_KEY }}
      run: |
        echo "sdk.dir=$ANDROID_HOME" > local.properties
        echo "GEMINI_API_KEY=\"$SECURE_GEMINI_KEY\"" >> local.properties
        echo "GEMINI_API_KEY=$SECURE_GEMINI_KEY" >> gradle.properties
        echo "GEMINI_API_KEY=\"$SECURE_GEMINI_KEY\"" > .env
        echo "GEMINI_API_KEY=\"$SECURE_GEMINI_KEY\"" > .env.example
        
        # Automatic temporary keystore generate kar rahe hain taake missing wala error bypass ho jaye
        mkdir -p ~/.android
        keytool -genkey -v -keystore ~/.android/debug.keystore -storepass android -alias androiddebugkey -keypass android -keyalg RSA -keysize 2048 -validity 10000 -dname "CN=Android Debug,O=Android,C=US"
        cp ~/.android/debug.keystore ./debug.keystore
        cp ~/.android/debug.keystore ./app/debug.keystore || true

    - name: Upgrade Gradle and Force Unsigned Build
      run: |
        gradle wrapper --gradle-version 9.3.1
        chmod +x gradlew
        
        # -x validateSigningDebug se keystore ka error bypass hoga, aur ksp.allow.any.version se crash rukega
        ./gradlew assembleDebug --no-daemon -x test -x lint -x validateSigningDebug -Pksp.allow.any.version=true

    - name: Upload APK Artifact
      uses: actions/upload-artifact@v4
      with:
        name: app-debug-apk
        path: "**/build/outputs/apk/**/*.apk"
        
