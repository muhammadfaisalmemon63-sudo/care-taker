name: Android APK Build
on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        distribution: 'zulu'
        java-version: '17'

    - name: Unzip Project Files
      run: |
        unzip -o care-taker.zip -d extracted_project
        SETTINGS_PATH=$(find extracted_project -name "settings.gradle*" | head -n 1)
        PROJECT_DIR=$(dirname "$SETTINGS_PATH")
        mv "$PROJECT_DIR"/* . 2>/dev/null || true
        mv "$PROJECT_DIR"/[._]* . 2>/dev/null || true

    - name: Inject Configuration and Fix Missing Env Files
      env:
        SECURE_GEMINI_KEY: ${{ secrets.GEMINI_API_KEY }}
      run: |
        touch .env.example
        touch .env
        echo "GEMINI_API_KEY=\"$SECURE_GEMINI_KEY\"" > .env.example
        echo "GEMINI_API_KEY=\"$SECURE_GEMINI_KEY\"" > .env
        echo "sdk.dir=$ANDROID_HOME" > local.properties
        echo "GEMINI_API_KEY=\"$SECURE_GEMINI_KEY\"" >> local.properties
        echo "GEMINI_API_KEY=$SECURE_GEMINI_KEY" >> gradle.properties

    - name: Force Build APK Ignoring Warnings
      run: |
        if [ ! -f gradlew ]; then
          gradle wrapper
        fi
        chmod +x gradlew
        # -x test aur lint options errors ko bypass karke har haal mein build banayenge
        ./gradlew assembleDebug -x test -x lint --no-daemon

    - name: Upload APK Artifact
      uses: actions/upload-artifact@v4
      with:
        name: app-debug-apk
        path: "**/build/outputs/apk/debug/*.apk"
        
